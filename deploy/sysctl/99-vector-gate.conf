# ==============================================================================
# LINUX HOST KERNEL TUNING CHO VECTOR SMART GATE
# Enterprise High-Throughput Ingress (150,000+ Concurrent Connections)
# Phòng vệ cạn kiệt tài nguyên TIME_WAIT, SYN Backlog, và Linux Kernel Pipes
# File: /etc/sysctl.d/99-vector-gate.conf (hoặc áp dụng bằng: sysctl -p)
# ==============================================================================

# [RSK-02] Tái sử dụng an toàn các socket ở trạng thái TIME_WAIT cho các kết nối loopback/nội bộ
# Ngăn chặn cạn kiệt ephemeral ports khi có hàng trăm kết nối ngắn hạn ngắt mở liên tục.
net.ipv4.tcp_tw_reuse = 1

# [RSK-02] Giảm thời gian lưu giữ socket trong trạng thái FIN-WAIT-2 từ mặc định 60s xuống 15s
# Thu hồi nhanh chóng tài nguyên bộ đệm socket sau khi client đóng kết nối.
net.ipv4.tcp_fin_timeout = 15

# [RSK-02] Mở rộng dải cổng cục bộ Ephemeral Port Range lên toàn dải (1024 - 65535)
# Cung cấp 64,511 cổng khả dụng thay vì dải mặc định hạn hẹp (32768 - 60999: chỉ ~28,231 cổng).
net.ipv4.ip_local_port_range = 1024 65535

# [RSK-02 / RSK-06] Nâng kích thước hàng đợi tiếp nhận TCP socket backlog (listen) lên 65,535
# Chống tràn hàng đợi accept khi có bão kết nối (burst conn/s) đổ dồn vào Vector Gate.
net.core.somaxconn = 65535

# [RSK-02 / RSK-06] Nâng kích thước hàng đợi TCP SYN Backlog (chưa bắt tay xong 3-way handshake)
# Ngăn chặn hiện tượng drop gói SYN khi hàng trăm máy Beat và client đồng thời tái kết nối.
net.ipv4.tcp_max_syn_backlog = 65535

# [RSK-01 / RSK-06] Nâng giới hạn trần tổng số trang nhớ pipe (4KB pages) cho toàn bộ hệ thống
# 1,048,576 trang nhớ = 4GB RAM tối đa dành cho bộ đệm Kernel Pipe splice(2) zero-copy.
# Đảm bảo hàng chục nghìn luồng splice không bao giờ bị ENOMEM / EPERM khi cấp phát pipe.
fs.pipe-user-pages-hard = 1048576

# [RSK-01] Nâng dung lượng tối đa cho 1 Kernel Pipe lên 4,194,304 bytes (4MB / 1024 pages)
# Cho phép buffer co giãn đàn hồi phục vụ lưu lượng log đỉnh cao (burst traffic) không bị nghẽn.
fs.pipe-max-size = 4194304
