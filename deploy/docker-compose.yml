version: '3.8'

services:
  vector-gate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: l1ghtg3m/vector-gate:2.5.1
    container_name: vector-smart-gate
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    cap_add:
      - NET_ADMIN
    ports:
      - "5000:5000"
    environment:
      - RUST_LOG=info
      - VECTOR_LOG=info
      - MALLOC_CONF=dirty_decay_ms:0,muzzy_decay_ms:0
    volumes:
      - ./config/vector.yaml:/etc/vector/vector.yaml:ro
      - ./vrl:/etc/vector/vrl
      - ./output:/var/log/vector
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5000/", "-X", "POST", "-d", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
