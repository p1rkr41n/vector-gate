[package]
name = "vector-gate"
version = "2.5.6"
edition = "2021"
description = "High-Performance Multi-Gate Multiplexing Ingress Engine with Zero-Copy Linux Kernel Splice for Timberio Vector"
license = "MPL-2.0"

[dependencies]
tokio = { workspace = true, features = ["full"] }
libc = { workspace = true, features = ["std"] }
socket2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
