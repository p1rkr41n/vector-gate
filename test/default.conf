# ==============================================================================
# VECTOR BENCHMARK & INGESTION CONFIGURATION (DEFAULT)
# ==============================================================================

# Target Vector Smart Gate / Ingress Gateway
TARGET_IP=127.0.0.1
TARGET_PORT=5000

# Protocol / Log Type:
# Available: syslog_rfc5424, syslog_rfc3164, ndjson, datadog, splunk_hec,
#            nginx_combined, cisco_asa, suricata_eve, cef, fortigate_kv, auditd
LOG_TYPE=syslog_rfc5424

# Workload Parameters
TOTAL_EVENTS=100000
CONCURRENCY=8
BATCH_SIZE=500

# Dynamic In-Memory Mutation (Auto-mutates timestamp & ID on-the-fly)
MUTATE=true

# Output format (true for raw JSON, false for ASCII report)
OUTPUT_JSON=false

