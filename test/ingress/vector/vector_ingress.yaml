data_dir: "/home/manager/vectormod/smart_ingress/data"

sources:
  s_syslog:
    type: syslog
    mode: tcp
    address: "127.0.0.1:15514"

  s_http:
    type: http_server
    address: "127.0.0.1:18080"
    decoding:
      codec: bytes

  s_splunk:
    type: splunk_hec
    address: "127.0.0.1:18088"

  s_datadog:
    type: datadog_agent
    address: "127.0.0.1:18282"

  s_socket:
    type: socket
    mode: tcp
    address: "127.0.0.1:15515"
    decoding:
      codec: bytes

  s_beats:
    type: logstash
    address: "127.0.0.1:15044"

  s_fluent:
    type: fluent
    mode: tcp
    address: "127.0.0.1:24224"

transforms:
  tag_syslog:
    type: remap
    inputs: [s_syslog]
    source: |
      .ingress_channel = "syslog_rfc"
      .received_at = now()

  tag_http:
    type: remap
    inputs: [s_http]
    source: |
      .ingress_channel = "http_generic"
      .received_at = now()

  tag_splunk:
    type: remap
    inputs: [s_splunk]
    source: |
      .ingress_channel = "splunk_hec"
      .received_at = now()

  tag_datadog:
    type: remap
    inputs: [s_datadog]
    source: |
      .ingress_channel = "datadog_intake"
      .received_at = now()

  tag_socket:
    type: remap
    inputs: [s_socket]
    source: |
      .ingress_channel = "raw_socket"
      .received_at = now()

  tag_beats:
    type: remap
    inputs: [s_beats]
    source: |
      .ingress_channel = "beats_lumberjack"
      .received_at = now()

  tag_fluent:
    type: remap
    inputs: [s_fluent]
    source: |
      .ingress_channel = "fluent_forward"
      .received_at = now()

sinks:
  sink_unified_file:
    type: file
    inputs: [tag_syslog, tag_http, tag_splunk, tag_datadog, tag_socket, tag_beats, tag_fluent]
    path: "/home/manager/vectormod/smart_ingress/output/all_forwarded_logs.jsonl"
    encoding:
      codec: json

  sink_console:
    type: console
    inputs: [tag_syslog, tag_http, tag_splunk, tag_datadog, tag_socket, tag_beats, tag_fluent]
    encoding:
      codec: json

