global
    log stdout format raw local0 info
    pidfile /home/manager/vectormod/smart_ingress/haproxy/haproxy.pid
    stats socket /home/manager/vectormod/smart_ingress/haproxy/haproxy.sock mode 660 level admin expose-fd listeners

defaults
    log global
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    mode tcp

# CỔNG INGRESS DUY NHẤT TOÀN HỆ THỐNG (SINGLE PORT 0.0.0.0:5000)
frontend ingress_single_port
    bind 0.0.0.0:5000
    mode tcp
    tcp-request inspect-delay 200ms

    # 1. Nhận diện Syslog RFC 3164 / RFC 5424 / CEF / Fortinet / Cisco (Byte đầu là '<' = 0x3c)
    acl is_syslog req.payload(0,1) -m bin 3c

    # 2. Nhận diện Beats / Lumberjack v2 (Byte đầu là 0x32 = '2' hoặc 0x31 = '1')
    acl is_beats req.payload(0,1) -m bin 32 31

    # 3. Nhận diện Fluent Forward (MessagePack headers 0x92 - 0x94)
    acl is_fluent req.payload(0,1) -m bin 92 93 94

    # 4. Nhận diện họ giao thức HTTP/HTTPS
    acl is_http req.payload(0,4) -m str "POST" || req.payload(0,3) -m str "GET" || req.payload(0,3) -m str "PUT" || req.payload(0,4) -m str "HEAD" || req.payload(0,6) -m str "DELETE"

    # Chấp nhận gói ngay khi một trong các điều kiện khớp
    tcp-request content accept if is_syslog
    tcp-request content accept if is_beats
    tcp-request content accept if is_fluent
    tcp-request content accept if is_http

    use_backend be_vector_syslog if is_syslog
    use_backend be_vector_beats if is_beats
    use_backend be_vector_fluent if is_fluent
    use_backend be_internal_http if is_http

    # 5. Mặc định: Chuyển tiếp vào Raw Socket TCP của Vector
    default_backend be_vector_raw

# BỘ CHUYỂN TIẾP NỘI BỘ VÀO HTTP ROUTER (LOOPBACK L7 DISPATCHER)
backend be_internal_http
    mode tcp
    server srv_http_router 127.0.0.1:5001

frontend fe_http_router
    bind 127.0.0.1:5001
    mode http
    # Phân loại Splunk HEC: /services/collector
    use_backend be_vector_splunk if { path_beg -i /services/collector }
    # Phân loại Datadog Agent API: /api/v1, /api/v2, /v1/input
    use_backend be_vector_datadog if { path_beg -i /api/v1 } || { path_beg -i /api/v2 } || { path_beg -i /v1/input }
    # Mặc định: Generic HTTP Server của Vector
    default_backend be_vector_http_gen

# CÁC BACKEND CHUYỂN TIẾP TRỰC TIẾP VÀO VECTOR CORE (127.0.0.1)
backend be_vector_syslog
    server srv_syslog 127.0.0.1:15514

backend be_vector_beats
    server srv_beats 127.0.0.1:15044

backend be_vector_fluent
    server srv_fluent 127.0.0.1:24224

backend be_vector_splunk
    mode http
    server srv_splunk 127.0.0.1:18088

backend be_vector_datadog
    mode http
    server srv_datadog 127.0.0.1:18282

backend be_vector_http_gen
    mode http
    server srv_http_gen 127.0.0.1:18080

backend be_vector_raw
    server srv_raw 127.0.0.1:15515

